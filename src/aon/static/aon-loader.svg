<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="200 120 400 400" role="img" aria-label="AON loading">
<style>
.r{transform-origin:400px 320px}
.cw1{animation:spin 6s linear infinite}
.ccw1{animation:spin 9s linear infinite reverse}
.cw2{animation:spin 3s linear infinite}
.ccw2{animation:spin 4.5s linear infinite reverse}
.ticks{animation:spin 20s linear infinite}
.core{animation:pulse 1.6s ease-in-out infinite}
.mark{stroke-dasharray:420;animation:draw 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.96)}}
@keyframes draw{0%{stroke-dashoffset:420}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dasharray:none!important}}
</style>
<defs>
<linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="230" y1="490" x2="570" y2="150">
<stop offset="0" stop-color="#2DE2F0"/><stop offset="0.5" stop-color="#3B8BF6"/><stop offset="1" stop-color="#8B5CF6"/>
</linearGradient>
<linearGradient id="light" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#E0FBFF"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g filter="url(#glow)" fill="none" stroke="url(#ring)">
<circle class="r core" cx="400" cy="320" r="92" stroke-width="12"/>
<circle cx="400" cy="320" r="107" stroke-width="2.5" opacity="0.6"/>
<g class="r ticks"><circle cx="400" cy="320" r="124" stroke-width="20" stroke-dasharray="11 13.35" opacity="0.9"/></g>
<g class="r cw1"><circle cx="400" cy="320" r="146" stroke-width="7" stroke-dasharray="260 40 120 497" transform="rotate(-70 400 320)"/></g>
<g class="r ccw1"><circle cx="400" cy="320" r="160" stroke-width="3" stroke-dasharray="150 60 90 705" transform="rotate(95 400 320)" opacity="0.8"/></g>
<g class="r cw2"><circle cx="400" cy="320" r="174" stroke-width="8" stroke-dasharray="210 883" transform="rotate(-75 400 320)"/></g>
<g class="r ccw2"><circle cx="400" cy="320" r="174" stroke-width="3" stroke-dasharray="70 1023" transform="rotate(150 400 320)" opacity="0.7"/></g>
</g>
<g filter="url(#glow)" transform="translate(356 269) scale(0.85)" fill="none" stroke="url(#light)" stroke-width="18" stroke-miterlimit="4">
<path class="mark" d="M 80 120 L 80 9 L 14 106 L 80 106"/>
</g>
</svg>
